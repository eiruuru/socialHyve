<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>PWA icon</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@800&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 512px; height: 512px; overflow: hidden; }
    body {
      background: #14110C;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .mark { width: 280px; height: 280px; }
    .mark svg { width: 100%; height: 100%; display: block; }
  </style>
</head>
<body>
  <div id="icon-canvas" class="mark">
    <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <polygon points="50,3 93,26 93,74 50,97 7,74 7,26" fill="#14110C"/>
      <path d="M32 50 L45 63 L70 35" fill="none" stroke="#F6A600" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </div>
</body>
</html>
