# Minimal Supabase CLI config for socialHyve
# Link: npx supabase link --project-ref YOUR_PROJECT_REF

project_id = "socialhyve"

[api]
enabled = true

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = [
  "http://localhost:5173",
  "http://localhost:5173/app/settings/accounts",
  "http://localhost:5173/app/settings/canva",
]

[storage]
enabled = true

[functions.meta-oauth-start]
verify_jwt = true

[functions.meta-oauth-callback]
verify_jwt = false

[functions.canva-oauth-start]
verify_jwt = true

[functions.canva-oauth-callback]
verify_jwt = false

[functions.canva-list-designs]
verify_jwt = true

[functions.canva-export-design]
verify_jwt = true

[functions.canva-get-design]
verify_jwt = true

[functions.canva-get-design-pages]
verify_jwt = true

[functions.publish-post]
verify_jwt = false

[functions.meta-list-ig-media]
verify_jwt = true

[functions.refresh-tokens]
verify_jwt = false

[functions.cleanup-post-media]
verify_jwt = false

[functions.review-by-token]
verify_jwt = false

[functions.accept-invite]
verify_jwt = false

[functions.add-member-by-email]
verify_jwt = true

[functions.send-invite-email]
verify_jwt = true

[functions.send-workflow-email]
verify_jwt = true

[storage.buckets.post-media]
public = true
